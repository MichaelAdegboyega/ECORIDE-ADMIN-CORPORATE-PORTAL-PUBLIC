<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link
rel="stylesheet"
type="text/css"
href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
/>
<link
rel="stylesheet"
type="text/css"
href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
/>
<link rel="stylesheet" href="ResetPassword.css"/>
</head>
<body>
<div class="left-side"  >
<img src="Assets/pics.png" class="overlay-image">
<div class="down-image">
<img src="Assets/Landing Image.png">
</div>
</div>


<div class="right-side">
<div class="Header">
<h1>Set New Password</h1>
<p>Choose a new password for your account.</p>
</div>
<div class="forgot-password-container">
<form id="reset-password-form">
<div class="input-1">
<label for="new-password">New password</label>
<input type="password" id="new-password" placeholder="Enter new password" required minlength="8">
<i class="ph ph-eye" id="show-new-password"></i>
</div>
<div class="input-1">
<label for="confirm-new-password">Confirm new password</label>
<input type="password" id="confirm-new-password" placeholder="Re-enter new password" required minlength="8">
<i class="ph ph-eye" id="show-confirm-password"></i>
</div>
<div id="status-message" class="status-message"></div>
<button type="submit">Reset Password</button>
</form>
<div class="line"></div>
</div>
</div>
<script src="ResetPassword.js"></script>
</body>
</html>
