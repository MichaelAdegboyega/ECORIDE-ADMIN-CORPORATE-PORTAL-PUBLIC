<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
     />
     
    <link rel="stylesheet" href="SignUp.css"/>
    <script src="script1.js" defer></script>
    <script src="SignUp.js" defer></script>
</head>
<body>

  
    <div class="left-side"  >
        <img src="Assets/pics.png" class="overlay-image">
  <div class="down-image">
        <img src="Assets/Landing Image.png">
  </div>
</div>

    <div class="right-side">
        <div class="Header">
            <h2>Create <span>Account</span></h2>
            <p class="subtitle">Join Ecoride and start carpooling today.</p>
        </div>  
        <div class="registration-container">
            <form class="reg-con">
                <div class="input-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" placeholder="Enter Company Name" required>
                </div>
                <div class="input-group">
                    <label for="rcNumber">RC Number</label>
                    <input type="text" id="rcNumber" placeholder="Enter RC Number" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter Email" required>
                </div>
                <div class="input-1">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                    <i class="ph ph-eye-slash" id="show-password"></i>
                </div>
                <div class="input-2">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Enter password" required>
                    <i class="ph ph-eye-slash" id="confirm-password"></i>
                </div>

                <input type="hidden" id="countryCode" value="+234">
                <input type="hidden" id="phoneNumber" value="">

                <button class="load-users" type="submit">Sign Up</button>
                <p class="already-have-acct">Already have an acount? <a href="Login.html">Log In</a></p>
                <div id="error-message" class="error-message"></div>
                <div id="users"></div>
            </form>            
        </div>
    </div>
   
</body>
</html>
